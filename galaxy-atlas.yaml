openapi: 3.0.3
info:
  title: Galaxy Atlas API
  description: Uzay nesnelerini (asteroid, uydu ve roket) takip etmek için geliştirilen RESTful API.
  version: 1.0.0

servers:
  - url: https://api.galaxyatlas.com/v1
    description: Production server
  - url: http://localhost:3000
    description: Development server
paths:

  /auth/register:
    post:
      summary: Yeni kullanıcı kaydı oluşturur
      description: Kullanıcıların sisteme kayıt olmasını sağlar.
      responses:
        '201':
          description: Kullanıcı başarıyla oluşturuldu

  /auth/login:
    post:
      summary: Kullanıcı giriş yapar
      description: Kullanıcının sisteme giriş yapmasını sağlar.
      responses:
        '200':
          description: Giriş başarılı

  /users/{userId}:
    put:
      summary: Kullanıcı profilini günceller
      description: Kullanıcının profil bilgilerini günceller.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Profil güncellendi

    delete:
      summary: Kullanıcı hesabını siler
      description: Kullanıcının hesabını sistemden kaldırır.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Kullanıcı silindi
  /space-objects:
    get:
      summary: Uzay nesnelerini listeler
      description: Sistemde bulunan asteroid, uydu ve roketleri listeler.
      responses:
        '200':
          description: Uzay nesneleri başarıyla listelendi

  /space-objects/{id}:
    get:
      summary: Uzay nesnesi detayını getirir
      description: Seçilen uzay nesnesinin detay bilgilerini getirir.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Uzay nesnesi detayı getirildi

  /space-objects/compare:
    post:
      summary: Uzay nesnelerini karşılaştırır
      description: Seçilen iki veya daha fazla uzay nesnesini karşılaştırır.
      responses:
        '200':
          description: Karşılaştırma başarılı

  /space-objects/filter:
    post:
      summary: Uzay nesnelerini filtreler
      description: Hız, mesafe veya tür gibi kriterlere göre uzay nesnelerini filtreler.
      responses:
        '200':
          description: Filtreleme başarılı

  /space-objects/anomaly-detect:
    post:
      summary: Olağandışı uzay nesnelerini tespit eder
      description: Yapay zeka destekli şekilde olağandışı hız veya mesafeye sahip nesneleri tespit eder.
      responses:
        '200':
          description: Anomali tespiti başarılı
  /favorites:
    post:
      summary: Favoriye ekler
      description: Kullanıcının seçtiği uzay nesnesini favorilerine ekler.
      responses:
        '201':
          description: Favoriye eklendi

    get:
      summary: Favori listesini getirir
      description: Kullanıcının favoriye eklediği uzay nesnelerini listeler.
      responses:
        '200':
          description: Favori listesi getirildi

  /favorites/{favoriteId}:
    delete:
      summary: Favoriden çıkarır
      description: Kullanıcının favorilere eklediği nesneyi favorilerden kaldırır.
      parameters:
        - name: favoriteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Favoriden çıkarıldı

  /map/asteroids:
    get:
      summary: Harita üzerinde asteroidleri gösterir
      description: Asteroidlerin harita üzerindeki konumlarını getirir.
      responses:
        '200':
          description: Asteroid konumları getirildi

  /map/satellites:
    get:
      summary: Harita üzerinde uyduları gösterir
      description: Uyduların harita üzerindeki konumlarını getirir.
      responses:
        '200':
          description: Uydu konumları getirildi

  /map/rockets:
    get:
      summary: Harita üzerinde roketleri gösterir
      description: Roketlerin harita üzerindeki konumlarını getirir.
      responses:
        '200':
          description: Roket konumları getirildi

  /comments:
    post:
      summary: Yorum ekler
      description: Kullanıcının uzay nesneleri hakkında yorum yapmasını sağlar.
      responses:
        '201':
          description: Yorum eklendi

  /comments/{commentId}:
    delete:
      summary: Yorumu siler
      description: Kullanıcının kendi yorumunu silmesini sağlar.
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Yorum silindi

  /recommendations:
    get:
      summary: Yapay zeka destekli öneriler getirir
      description: Kullanıcının geçmiş işlemlerine göre benzer uzay nesnelerini önerir.
      responses:
        '200':
          description: Öneriler başarıyla getirildi
