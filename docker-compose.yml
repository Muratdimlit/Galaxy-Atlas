version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: galaxy_postgres
    restart: always
    environment:
      POSTGRES_DB: galaxy_atlas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
    ports:
      - "5433:5432"
    volumes:
      - galaxy_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: galaxy_redis
    restart: always
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: galaxy_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

volumes:
  galaxy_postgres_data: